{% load static %}
<div class="cookie-consent" id="cookieConsent" role="region" aria-labelledby="cookieConsentTitle" hidden>
    <div class="cookie-consent-copy">
        <strong id="cookieConsentTitle">Essential cookies</strong>
        <p>
            Essential cookies keep sign-in working. No ads or analytics.
            Read our <a href="{% url 'cookie_policy' %}">Cookie Policy</a>.
        </p>
    </div>
    <div class="cookie-consent-actions">
        <button type="button" class="cookie-btn cookie-btn-primary" data-cookie-choice="acknowledged">Got it</button>
    </div>
</div>
<script>
    (function () {
        var storageKey = 'greenhill.cookieNotice';
        var banner = document.getElementById('cookieConsent');
        if (!banner) {
            return;
        }
        try {
            if (!window.localStorage.getItem(storageKey)) {
                banner.hidden = false;
            }
        } catch (error) {
            banner.hidden = false;
        }
        banner.querySelectorAll('[data-cookie-choice]').forEach(function (button) {
            button.addEventListener('click', function () {
                try {
                    window.localStorage.setItem(storageKey, button.dataset.cookieChoice);
                } catch (error) {
                    banner.hidden = true;
                }
                banner.hidden = true;
            });
        });
    }());
</script>
